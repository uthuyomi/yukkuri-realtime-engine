<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Yukkuri Realtime Test</title>
</head>

<body>
    <h1>Yukkuri Realtime Test</h1>

    <button id="start-audio">
        Start Audio
    </button>

    <button id="start-microphone">
        Start Microphone
    </button>

    <span id="vad-status">
        VAD: stopped
    </span>

    <p>
        Start Audioを押してからDevTools Consoleでテストしてください。
    </p>

    <script>
        const ENGINE_SAMPLE_RATE = 8000;

        let audioContext = null;
        let playerNode = null;

        let microphoneVAD = null;
        let microphoneStarted = false;
        let userSpeaking = false;

        let currentGenerationID = null;
        let currentSpeechSequence = null;

        let inputSampleRate = ENGINE_SAMPLE_RATE;
        let inputChannels = 1;
        let inputBits = 16;

        const ws = new WebSocket(
            "ws://127.0.0.1:8765/v1/realtime"
        );

        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            console.log("CONNECTED");
        };

        ws.onerror = (event) => {
            console.error(
                "WS ERROR:",
                event
            );
        };

        ws.onclose = (event) => {
            console.log(
                "CLOSED:",
                event.code,
                event.reason
            );
        };

        ws.onmessage = (event) => {
            if (typeof event.data === "string") {
                handleEvent(
                    JSON.parse(event.data)
                );

                return;
            }

            if (event.data instanceof ArrayBuffer) {
                handleAudioBinary(event.data);
            }
        };

        document
            .getElementById("start-audio")
            .addEventListener(
                "click",
                startAudio
            );

        document
            .getElementById("start-microphone")
            .addEventListener(
                "click",
                startMicrophone
            );

        async function startAudio() {
            if (!audioContext) {
                audioContext = new AudioContext();

                await audioContext.audioWorklet.addModule(
                    "./audio-worklet.js"
                );

                playerNode = new AudioWorkletNode(
                    audioContext,
                    "pcm-player",
                    {
                        numberOfInputs: 0,
                        numberOfOutputs: 1,
                        outputChannelCount: [1]
                    }
                );

                playerNode.port.onmessage = (event) => {
                    const message = event.data;

                    if (
                        message.type !==
                        "playback.progress"
                    ) {
                        return;
                    }

                    if (
                        !ws ||
                        ws.readyState !== WebSocket.OPEN
                    ) {
                        return;
                    }

                    if (
                        !message.generationId ||
                        !message.sampleRate ||
                        message.playedFrames == null
                    ) {
                        return;
                    }

                    const playedSeconds =
                        message.playedFrames /
                        message.sampleRate;

                    const progressEvent = {
                        type: "playback.progress",
                        generation_id:
                            message.generationId,
                        data: {
                            played_seconds:
                                playedSeconds
                        }
                    };

                    console.log(
                        "PLAYBACK PROGRESS SEND:",
                        progressEvent
                    );

                    ws.send(
                        JSON.stringify(
                            progressEvent
                        )
                    );
                };

                playerNode.connect(
                    audioContext.destination
                );
            }

            if (audioContext.state !== "running") {
                await audioContext.resume();
            }

            console.log(
                "AUDIO READY:",
                audioContext.sampleRate
            );
        }

        async function startMicrophone() {
            if (microphoneStarted) {
                console.log("MICROPHONE ALREADY STARTED");
                return;
            }

            await startAudio();

            console.log("INITIALIZING SILERO VAD");

            microphoneVAD = await vad.MicVAD.new({
                onnxWASMBasePath:
                    "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",

                baseAssetPath:
                    "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/",

                onSpeechStart: () => {
                    console.log(
                        "SILERO CALLBACK: onSpeechStart"
                    );

                    handleUserSpeechStart();
                },

                onSpeechEnd: (audio) => {
                    console.log(
                        "SILERO CALLBACK: onSpeechEnd",
                        audio?.length
                    );

                    handleUserSpeechEnd(audio);
                },

                onVADMisfire: () => {
                    console.log(
                        "SILERO CALLBACK: onVADMisfire"
                    );

                    handleVADMisfire();
                }
            });

            await microphoneVAD.start();

            microphoneStarted = true;

            setVADStatus("listening");

            console.log("MICROPHONE + SILERO VAD READY");
        }

        function handleUserSpeechStart() {
            if (userSpeaking) {
                return;
            }

            userSpeaking = true;

            setVADStatus("speech");

            console.log(
                "USER SPEECH STARTED",
                {
                    generation:
                        currentGenerationID
                }
            );

            if (!currentGenerationID) {
                return;
            }

            requestBargeIn(
                currentGenerationID
            );
        }

        function handleUserSpeechEnd(audio) {
            userSpeaking = false;

            setVADStatus("listening");

            if (
                !audio ||
                audio.length === 0
            ) {
                return;
            }

            console.log(
                "USER SPEECH ENDED",
                {
                    samples: audio.length
                }
            );

            sendUserSpeech(audio);
        }

        function sendUserSpeech(audio) {
            if (
                !ws ||
                ws.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            const pcm16 =
                float32ToPCM16(audio);

            const sampleRate = 16000;

            ws.send(
                JSON.stringify({
                    type: "input_audio.start",
                    data: {
                        sample_rate: sampleRate,
                        channels: 1,
                        encoding: "pcm_s16le"
                    }
                })
            );

            /*
             * Keep every WebSocket binary message
             * comfortably below the server read limit.
             *
             * 16 KiB = 8192 PCM16 mono samples
             *        = about 512 ms at 16 kHz.
             */
            const chunkSize = 16 * 1024;

            const bytes =
                new Uint8Array(
                    pcm16.buffer,
                    pcm16.byteOffset,
                    pcm16.byteLength
                );

            for (
                let offset = 0;
                offset < bytes.length;
                offset += chunkSize
            ) {
                const end =
                    Math.min(
                        offset + chunkSize,
                        bytes.length
                    );

                const chunk =
                    bytes.slice(
                        offset,
                        end
                    );

                ws.send(
                    chunk.buffer
                );
            }

            ws.send(
                JSON.stringify({
                    type: "input_audio.commit"
                })
            );

            console.log(
                "INPUT AUDIO STREAMED:",
                pcm16.byteLength,
                "bytes"
            );
        }

        function float32ToPCM16(input) {
            const output =
                new Int16Array(
                    input.length
                );

            for (
                let i = 0;
                i < input.length;
                i++
            ) {
                const sample =
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            input[i]
                        )
                    );

                output[i] =
                    sample < 0
                        ? sample * 32768
                        : sample * 32767;
            }

            return output;
        }

        function handleVADMisfire() {
            userSpeaking = false;

            setVADStatus("listening");

            console.log(
                "VAD MISFIRE"
            );
        }

        function requestBargeIn(
            generationID
        ) {
            if (
                !generationID ||
                !ws ||
                ws.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            console.log(
                "BARGE-IN:",
                generationID
            );

            /*
             * Stop local playback immediately.
             *
             * Do not wait for the server round trip.
             * This is important for interruption latency.
             */
            if (playerNode) {
                playerNode.port.postMessage({
                    type: "clear",
                    generationId:
                        generationID
                });
            }

            /*
             * Cancel server-side generation.
             */
            ws.send(
                JSON.stringify({
                    type: "generation.cancel",
                    generation_id:
                        generationID
                })
            );
        }

        function setVADStatus(
            status
        ) {
            const element =
                document.getElementById(
                    "vad-status"
                );

            if (!element) {
                return;
            }

            element.textContent =
                "VAD: " + status;
        }

        function handleEvent(message) {
            console.log(
                "EVENT:",
                message
            );

            switch (message.type) {
                case "generation.created":
                    currentGenerationID =
                        message.generation_id;

                    if (playerNode) {
                        playerNode.port.postMessage({
                            type: "generation",
                            generationId:
                                currentGenerationID
                        });
                    }

                    break;

                case "response.audio.chunk.started":
                    startAudioChunk(message);
                    break;

                case "response.audio.delta":
                    break;

                case "response.audio.chunk.done":
                    finishAudioChunk(message);
                    break;

                case "generation.cancelled":
                    stopPlayback();
                    break;
            }
        }

        function startAudioChunk(message) {
            currentSpeechSequence =
                message.data.sequence;

            inputSampleRate =
                message.data.sample_rate;

            inputChannels =
                message.data.channels;

            inputBits =
                message.data.bits_per_sample;

            console.log(
                "PCM CHUNK START:",
                currentSpeechSequence,
                inputSampleRate,
                inputChannels,
                inputBits,
                message.data.text
            );
        }

        function handleAudioBinary(buffer) {
            if (!playerNode || !audioContext) {
                console.warn(
                    "Audio received before Start Audio"
                );

                return;
            }

            if (currentSpeechSequence === null) {
                console.warn(
                    "PCM received without active speech chunk"
                );

                return;
            }

            if (inputBits !== 16) {
                console.error(
                    "Unsupported PCM bit depth:",
                    inputBits
                );

                return;
            }

            if (inputChannels !== 1) {
                console.error(
                    "Unsupported PCM channel count:",
                    inputChannels
                );

                return;
            }

            const pcm16 =
                new Int16Array(buffer);

            let samples =
                int16ToFloat32(pcm16);

            if (
                inputSampleRate !==
                audioContext.sampleRate
            ) {
                samples = resampleLinear(
                    samples,
                    inputSampleRate,
                    audioContext.sampleRate
                );
            }

            playerNode.port.postMessage(
                {
                    type: "audio",
                    generationId:
                        currentGenerationID,
                    samples
                },
                [samples.buffer]
            );

            console.log(
                "PCM:",
                currentSpeechSequence,
                buffer.byteLength,
                "bytes"
            );
        }

        function finishAudioChunk(message) {
            console.log(
                "PCM CHUNK DONE:",
                message.data.sequence,
                message.data.bytes,
                "bytes"
            );

            currentSpeechSequence = null;
        }

        function int16ToFloat32(input) {
            const output =
                new Float32Array(input.length);

            for (
                let i = 0;
                i < input.length;
                i++
            ) {
                const value = input[i];

                output[i] =
                    value < 0
                        ? value / 32768
                        : value / 32767;
            }

            return output;
        }

        function resampleLinear(
            input,
            sourceRate,
            targetRate
        ) {
            if (sourceRate === targetRate) {
                return input;
            }

            const ratio =
                sourceRate / targetRate;

            const outputLength =
                Math.max(
                    1,
                    Math.round(
                        input.length / ratio
                    )
                );

            const output =
                new Float32Array(
                    outputLength
                );

            for (
                let i = 0;
                i < outputLength;
                i++
            ) {
                const sourcePosition =
                    i * ratio;

                const index =
                    Math.floor(
                        sourcePosition
                    );

                const nextIndex =
                    Math.min(
                        index + 1,
                        input.length - 1
                    );

                const fraction =
                    sourcePosition - index;

                output[i] =
                    input[index] *
                    (1 - fraction) +
                    input[nextIndex] *
                    fraction;
            }

            return output;
        }

        function stopPlayback() {
            const cancelledGeneration =
                currentGenerationID;

            if (playerNode) {
                playerNode.port.postMessage({
                    type: "clear",
                    generationId:
                        cancelledGeneration
                });
            }

            currentGenerationID = null;
            currentSpeechSequence = null;

            console.log(
                "PLAYBACK CANCELLED:",
                cancelledGeneration
            );
        }

        window.ws = ws;
        window.stopPlayback = stopPlayback;
        window.startAudio = startAudio;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
</body>

</html>
