<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Yukkuri Realtime Test</title>
</head>

<body>
    <h1>Yukkuri Realtime Test</h1>

    <button id="start-audio">
        Start Audio
    </button>

    <button id="start-microphone">
        Start Microphone
    </button>

    <button onclick="stopMicrophone()">Stop Microphone</button>

    <span id="vad-status">
        VAD: stopped
    </span>

    <p>
        Start Audioを押してからDevTools Consoleでテストしてください。
    </p>

    <script>
        const ENGINE_SAMPLE_RATE = 8000;

        let audioContext = null;
        let playerNode = null;

        let microphoneVAD = null;
        let microphoneStarted = false;
        let microphoneStarting = false;
        let userSpeaking = false;

        let currentGenerationID = null;
        let currentSpeechSequence = null;

        let inputSampleRate = ENGINE_SAMPLE_RATE;
        let inputChannels = 1;
        let inputBits = 16;

        const ws = new WebSocket(
            "ws://127.0.0.1:8765/v1/realtime"
        );

        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            console.log("CONNECTED");
        };

        ws.onerror = (event) => {
            console.error(
                "WS ERROR:",
                event
            );
        };

        ws.onclose = (event) => {
            void stopMicrophone();
            stopPlayback();
            console.log(
                "CLOSED:",
                event.code,
                event.reason
            );
        };

        ws.onmessage = (event) => {
            if (typeof event.data === "string") {
                handleEvent(
                    JSON.parse(event.data)
                );

                return;
            }

            if (event.data instanceof ArrayBuffer) {
                handleAudioBinary(event.data);
            }
        };

        document
            .getElementById("start-audio")
            .addEventListener(
                "click",
                startAudio
            );

        document
            .getElementById("start-microphone")
            .addEventListener(
                "click",
                startMicrophone
            );

        async function startAudio() {
            if (!audioContext) {
                audioContext = new AudioContext();

                await audioContext.audioWorklet.addModule(
                    "./audio-worklet.js"
                );

                playerNode = new AudioWorkletNode(
                    audioContext,
                    "pcm-player",
                    {
                        numberOfInputs: 0,
                        numberOfOutputs: 1,
                        outputChannelCount: [1]
                    }
                );

                playerNode.port.onmessage = (event) => {
                    const message = event.data;

                    if (
                        message.type !==
                        "playback.progress"
                    ) {
                        return;
                    }

                    if (
                        !ws ||
                        ws.readyState !== WebSocket.OPEN
                    ) {
                        return;
                    }

                    if (
                        !message.generationId ||
                        !message.sampleRate ||
                        message.playedFrames == null
                    ) {
                        return;
                    }

                    const playedSeconds =
                        message.playedFrames /
                        message.sampleRate;

                    const progressEvent = {
                        type: "playback.progress",
                        generation_id:
                            message.generationId,
                        data: {
                            played_seconds:
                                playedSeconds
                        }
                    };

                    console.log(
                        "PLAYBACK PROGRESS SEND:",
                        progressEvent
                    );

                    ws.send(
                        JSON.stringify(
                            progressEvent
                        )
                    );
                };

                playerNode.connect(
                    audioContext.destination
                );
            }

            if (audioContext.state !== "running") {
                await audioContext.resume();
            }

            console.log(
                "AUDIO READY:",
                audioContext.sampleRate
            );
        }

        async function startMicrophone() {
            if (microphoneStarted || microphoneStarting) return;
            microphoneStarting = true;
            try {
                if (ws.readyState !== WebSocket.OPEN) throw new Error("WebSocket is not connected");
                await startAudio();
                microphoneVAD = await vad.MicVAD.new({
                    startOnLoad: false,
                    model: "v5",
                    redemptionMs: 160,
                    minSpeechMs: 96,
                    onnxWASMBasePath: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",
                    baseAssetPath: "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/",
                    // Silero supplies continuous resampled 16 kHz frames, including silence.
                    onFrameProcessed: (_probabilities, frame) => sendInputFrame(frame),
                    onSpeechStart: handleUserSpeechStart,
                    onSpeechEnd: handleUserSpeechEnd,
                    onVADMisfire: handleVADMisfire
                });
                sendInputEvent("input_audio.start", {
                    sample_rate: 16000, channels: 1, encoding: "pcm_s16le", mode: "realtime"
                });
                microphoneStarted = true;
                await microphoneVAD.start();
                setVADStatus("listening");
            } catch (error) {
                await stopMicrophone();
                console.error("Microphone failed", error);
                setVADStatus("error");
            } finally {
                microphoneStarting = false;
            }
        }

        function sendInputEvent(type, data) {
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type, data}));
        }

        function sendInputFrame(frame) {
            if (!microphoneStarted || ws.readyState !== WebSocket.OPEN) return;
            if (ws.bufferedAmount > 256 * 1024) {
                console.error("Input connection cannot keep up; stopping microphone");
                void stopMicrophone();
                return;
            }
            const bytes = new ArrayBuffer(frame.length * 2);
            const view = new DataView(bytes);
            for (let i = 0; i < frame.length; i++) {
                const sample = Math.max(-1, Math.min(1, frame[i]));
                view.setInt16(i * 2, sample < 0 ? sample * 32768 : sample * 32767, true);
            }
            ws.send(bytes);
        }

        async function stopMicrophone() {
            microphoneStarted = false;
            userSpeaking = false;
            sendInputEvent("input_audio.stop");
            const instance = microphoneVAD;
            microphoneVAD = null;
            if (instance) {
                try { await instance.destroy(); } catch (error) { console.error("VAD cleanup failed", error); }
            }
            setVADStatus("stopped");
        }

        function handleUserSpeechStart() {
            if (!microphoneStarted) return;
            if (userSpeaking) {
                return;
            }

            userSpeaking = true;

            setVADStatus("speech");

            console.log(
                "USER SPEECH STARTED",
                {
                    generation:
                        currentGenerationID
                }
            );

            // Playback interruption never waits for endpoint inference.
            if (currentGenerationID) requestBargeIn(currentGenerationID);
            else sendInputEvent("generation.cancel"); // also cancels pending STT
            sendInputEvent("input_audio.speech_start");
        }

        function handleUserSpeechEnd() {
            if (!microphoneStarted) return;
            userSpeaking = false;
            setVADStatus("waiting for turn decision");
            sendInputEvent("input_audio.speech_end");
        }

        function handleVADMisfire() {
            if (!microphoneStarted) return;
            userSpeaking = false;
            setVADStatus("listening");
            sendInputEvent("input_audio.vad_misfire");
        }

        function requestBargeIn(
            generationID
        ) {
            if (
                !generationID ||
                !ws ||
                ws.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            console.log(
                "BARGE-IN:",
                generationID
            );

            /*
             * Stop local playback immediately.
             *
             * Do not wait for the server round trip.
             * This is important for interruption latency.
             */
            if (playerNode) {
                playerNode.port.postMessage({
                    type: "clear",
                    generationId:
                        generationID
                });
            }

            /*
             * Cancel server-side generation.
             */
            ws.send(
                JSON.stringify({
                    type: "generation.cancel",
                    generation_id:
                        generationID
                })
            );
        }

        function setVADStatus(
            status
        ) {
            const element =
                document.getElementById(
                    "vad-status"
                );

            if (!element) {
                return;
            }

            element.textContent =
                "VAD: " + status;
        }

        function handleEvent(message) {
            console.log(
                "EVENT:",
                message
            );

            switch (message.type) {
                case "input_audio.turn":
                    setVADStatus(message.data.state);
                    if (message.data.error) console.error("Turn detector:", message.data.error);
                    if (message.data.reason === "input_limit") void stopMicrophone();
                    break;
                case "error":
                    console.error("Engine error:", message.data);
                    if (message.data.code === "invalid_input_audio") void stopMicrophone();
                    break;
                case "generation.created":
                    if (userSpeaking) { requestBargeIn(message.generation_id); break; }
                    currentGenerationID =
                        message.generation_id;

                    if (playerNode) {
                        playerNode.port.postMessage({
                            type: "generation",
                            generationId:
                                currentGenerationID
                        });
                    }

                    break;

                case "response.audio.chunk.started":
                    startAudioChunk(message);
                    break;

                case "response.audio.delta":
                    break;

                case "response.audio.chunk.done":
                    finishAudioChunk(message);
                    break;

                case "generation.cancelled":
                    stopPlayback();
                    break;
            }
        }

        function startAudioChunk(message) {
            currentSpeechSequence =
                message.data.sequence;

            inputSampleRate =
                message.data.sample_rate;

            inputChannels =
                message.data.channels;

            inputBits =
                message.data.bits_per_sample;

            console.log(
                "PCM CHUNK START:",
                currentSpeechSequence,
                inputSampleRate,
                inputChannels,
                inputBits,
                message.data.text
            );
        }

        function handleAudioBinary(buffer) {
            if (!playerNode || !audioContext) {
                console.warn(
                    "Audio received before Start Audio"
                );

                return;
            }

            if (currentSpeechSequence === null) {
                console.warn(
                    "PCM received without active speech chunk"
                );

                return;
            }

            if (inputBits !== 16) {
                console.error(
                    "Unsupported PCM bit depth:",
                    inputBits
                );

                return;
            }

            if (inputChannels !== 1) {
                console.error(
                    "Unsupported PCM channel count:",
                    inputChannels
                );

                return;
            }

            const pcm16 =
                new Int16Array(buffer);

            let samples =
                int16ToFloat32(pcm16);

            if (
                inputSampleRate !==
                audioContext.sampleRate
            ) {
                samples = resampleLinear(
                    samples,
                    inputSampleRate,
                    audioContext.sampleRate
                );
            }

            playerNode.port.postMessage(
                {
                    type: "audio",
                    generationId:
                        currentGenerationID,
                    samples
                },
                [samples.buffer]
            );

            console.log(
                "PCM:",
                currentSpeechSequence,
                buffer.byteLength,
                "bytes"
            );
        }

        function finishAudioChunk(message) {
            console.log(
                "PCM CHUNK DONE:",
                message.data.sequence,
                message.data.bytes,
                "bytes"
            );

            currentSpeechSequence = null;
        }

        function int16ToFloat32(input) {
            const output =
                new Float32Array(input.length);

            for (
                let i = 0;
                i < input.length;
                i++
            ) {
                const value = input[i];

                output[i] =
                    value < 0
                        ? value / 32768
                        : value / 32767;
            }

            return output;
        }

        function resampleLinear(
            input,
            sourceRate,
            targetRate
        ) {
            if (sourceRate === targetRate) {
                return input;
            }

            const ratio =
                sourceRate / targetRate;

            const outputLength =
                Math.max(
                    1,
                    Math.round(
                        input.length / ratio
                    )
                );

            const output =
                new Float32Array(
                    outputLength
                );

            for (
                let i = 0;
                i < outputLength;
                i++
            ) {
                const sourcePosition =
                    i * ratio;

                const index =
                    Math.floor(
                        sourcePosition
                    );

                const nextIndex =
                    Math.min(
                        index + 1,
                        input.length - 1
                    );

                const fraction =
                    sourcePosition - index;

                output[i] =
                    input[index] *
                    (1 - fraction) +
                    input[nextIndex] *
                    fraction;
            }

            return output;
        }

        function stopPlayback() {
            const cancelledGeneration =
                currentGenerationID;

            if (playerNode) {
                playerNode.port.postMessage({
                    type: "clear",
                    generationId:
                        cancelledGeneration
                });
            }

            currentGenerationID = null;
            currentSpeechSequence = null;

            console.log(
                "PLAYBACK CANCELLED:",
                cancelledGeneration
            );
        }

        window.ws = ws;
        window.stopPlayback = stopPlayback;
        window.startAudio = startAudio;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
</body>

</html>
