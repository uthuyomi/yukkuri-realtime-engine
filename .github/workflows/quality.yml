name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit source and documentation
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_check.py --ref HEAD
      - name: Go tests and clean executable build
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o dist/engine.exe ./cmd/engine
      - name: Go vet with documented Windows FFI exception
        shell: pwsh
        run: |
          # Native uintptr -> pointer return in AquesTalk is the sole excluded analyzer/package boundary.
          $packages = @(go list ./... | Where-Object { $_ -notlike '*/internal/providers/tts/aquestalk' -and $_ -notlike '*/cmd/engine' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -unsafeptr=false ./cmd/engine ./internal/providers/tts/aquestalk
      - name: TypeScript and browser unit tests
        run: |
          npm --prefix sdk/typescript ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix sdk/typescript test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix sdk/typescript run test:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test examples/browser/*.test.cjs examples/typescript/browser-voice/history.test.mjs
      - name: Python SDK, CLI and wheel
        run: |
          python -m pip install -e ./sdk/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s sdk/python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python sdk/python/tests/package_smoke.py
  portable-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Portable core race tests (Windows DLL adapter and entry point excluded)
        run: go test -race ./internal/... ./cmd/stt-bench
  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/turn-detector/requirements.txt
      - run: python -m pip install -r tools/turn-detector/requirements.txt
      - name: Fake detector HTTP tests (no model download)
        run: python -m unittest discover -s tools/turn-detector -v
